<div class="page" id="giftPage" data-page="gift">
      <div class="ph-stars"></div>
      <div class="help-header page-header">
        <div class="help-header-row">
          <button type="button" id="giftBackBtn" class="profile-back-btn header-back-btn btn-nav" aria-label="Назад" title="Назад" data-i18n-aria="navBack" data-i18n-title="navBack" onclick="if(window.goBack)goBack();else if(window.goToPage)goToPage('homePage')">←</button>
          <div class="help-title-wrap">
            <div class="help-title" data-i18n="giftPageTitle">Подарить песню</div>
          </div>
          <div class="help-header-spacer" aria-hidden="true"></div>
        </div>
      </div>
      <div class="scroll">
        <div class="gift">
          <span class="gift-to" id="giftToLabel" data-i18n="giftToPlaceholder">Для · выбери, кому</span>
          <div class="gift-cover"><div class="gift-cover-fill"></div>
            <div class="gift-cover-glyph"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg></div>
          </div>
          <div class="gift-name" id="giftSongName">—</div>
          <div class="gift-meta" id="giftSongMeta"></div>
          <div class="gift-dedi" id="giftDediPreview" data-i18n="giftDediPlaceholderPreview">Здесь появится твоё посвящение…</div>
        </div>
        <div class="sec" data-i18n="giftSecRecip">Для кого песня</div>
        <div class="recips" id="giftRecips">
          <button type="button" class="recip recip-add" id="giftRecipAdd"><span class="recip-av"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span><span class="recip-name" data-i18n="giftRecipAdd">Добавить</span></button>
        </div>
        <div id="giftAddNameRow" style="display:none;gap:8px;margin-top:10px;align-items:center;">
          <input type="text" id="giftAddNameInput" maxlength="40" placeholder="Имя того, кому даришь" data-i18n-placeholder="giftAddNamePh" style="flex:1;min-width:0;border:1px solid var(--line-2);background:var(--surface);border-radius:14px;padding:12px 14px;color:var(--text);font-size:14px;font-family:var(--sans);outline:none;box-sizing:border-box;" />
          <button type="button" id="giftAddNameOk" style="flex:none;border:none;background:var(--cta);color:#fff;font-size:13px;font-weight:600;padding:12px 18px;border-radius:9999px;cursor:pointer;font-family:var(--sans);min-height:0;width:auto;"><span data-i18n="giftAddNameOk">Готово</span></button>
        </div>
        <div class="sec" data-i18n="giftSecWords">Тёплые слова</div>
        <div class="dedi-box">
          <textarea id="giftDediInput" maxlength="140" placeholder="Напиши пару строк тому, кому даришь…" data-i18n-placeholder="giftDediPlaceholder"></textarea>
          <span class="dedi-count" id="giftDediCount">0/140</span>
        </div>
        <div class="dedi-presets" id="giftPresets">
          <button type="button" class="dedi-chip" data-i18n="giftPresetBday">С днём рождения</button>
          <button type="button" class="dedi-chip" data-i18n="giftPresetJust">Просто так, для тебя</button>
          <button type="button" class="dedi-chip" data-i18n="giftPresetSpecial">Ты особенный человек</button>
        </div>
        <div class="sec" data-i18n="giftSecHow">Как подарить</div>
        <div class="deliver" id="giftDeliver">
          <button type="button" class="dlv sel" data-d="link"><span class="di"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"></path><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"></path></svg></span><span data-i18n="giftDlvLink">Ссылкой</span></button>
          <button type="button" class="dlv" data-d="tg"><span class="di"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"></path><path d="M22 2 15 22l-4-9-9-4Z"></path></svg></span><span data-i18n="giftDlvTg">Telegram</span></button>
          <button type="button" class="dlv" data-d="qr"><span class="di"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><path d="M14 14h3v3M21 14v7h-7"></path></svg></span><span data-i18n="giftDlvQr">QR-код</span></button>
        </div>
      </div>
      <div class="foot">
        <div class="reward-note"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.2L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z"></path></svg> <span data-i18n="giftReward">+5 Искр тебе за подарок</span></div>
        <button type="button" class="send" id="giftSendBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"></path></svg> <span data-i18n="giftSendBtn">Подарить песню</span></button>
      </div>
      <div class="done-ov" id="giftDoneOv">
        <span class="done-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg></span>
        <h2 data-i18n="giftDoneTitle">Подарок отправлен!</h2>
        <p id="giftDoneText"></p>
        <div id="giftDoneShare" style="width:100%;max-width:300px;margin:18px 0 0;display:flex;flex-direction:column;gap:10px;">
          <div id="giftDoneLinkRow" style="display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:10px 12px;">
            <span id="giftDoneLink" style="flex:1;min-width:0;font-size:12.5px;color:rgba(245,241,251,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;"></span>
            <button type="button" id="giftDoneCopyBtn" style="flex:none;border:none;background:var(--cta);color:#fff;font-size:12px;font-weight:600;padding:8px 14px;border-radius:9999px;cursor:pointer;font-family:inherit;min-height:0;width:auto;"><span data-i18n="giftDoneCopy">Копировать</span></button>
          </div>
          <div id="giftDoneQr" style="display:none;justify-content:center;padding:6px;"></div>
        </div>
        <button type="button" class="send" id="giftDoneCloseBtn" data-i18n="giftDoneClose">Готово</button>
      </div>
    </div>
